<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .box{fill:#f7f7f7;stroke:#333;stroke-width:2;rx:14;ry:14}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222}
      .arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="30" y="95" width="220" height="150" class="box"/>
  <text x="140" y="130" text-anchor="middle" class="title">Perubahan tuntutan</text>
  <text x="140" y="162" text-anchor="middle" class="text">ancaman, risiko,</text>
  <text x="140" y="188" text-anchor="middle" class="text">teknologi, koordinasi</text>
  <text x="140" y="214" text-anchor="middle" class="text">dan adaptasi</text>

  <rect x="300" y="95" width="220" height="150" class="box"/>
  <text x="410" y="130" text-anchor="middle" class="title">Respons institusional</text>
  <text x="410" y="162" text-anchor="middle" class="text">Renstra 2025–2029:</text>
  <text x="410" y="188" text-anchor="middle" class="text">development, leadership,</text>
  <text x="410" y="214" text-anchor="middle" class="text">technology, merit</text>

  <rect x="570" y="95" width="250" height="150" class="box"/>
  <text x="695" y="130" text-anchor="middle" class="title">Unresolved tension</text>
  <text x="695" y="162" text-anchor="middle" class="text">investasi SDM luas, tetapi</text>
  <text x="695" y="188" text-anchor="middle" class="text">capability dan management</text>
  <text x="695" y="214" text-anchor="middle" class="text">masih perlu diperkuat</text>

  <rect x="870" y="95" width="220" height="150" class="box"/>
  <text x="980" y="130" text-anchor="middle" class="title">HRM–performance</text>
  <text x="980" y="158" text-anchor="middle" class="title">black box</text>
  <text x="980" y="190" text-anchor="middle" class="text">implementasi, experience,</text>
  <text x="980" y="216" text-anchor="middle" class="text">state, capability, task</text>

  <rect x="1140" y="95" width="230" height="150" class="box"/>
  <text x="1255" y="130" text-anchor="middle" class="title">Problem penelitian</text>
  <text x="1255" y="162" text-anchor="middle" class="text">bagaimana people investment</text>
  <text x="1255" y="188" text-anchor="middle" class="text">menjadi individual work</text>
  <text x="1255" y="214" text-anchor="middle" class="text">behavior?</text>

  <path d="M250 170 L300 170" class="arrow"/>
  <path d="M520 170 L570 170" class="arrow"/>
  <path d="M820 170 L870 170" class="arrow"/>
  <path d="M1090 170 L1140 170" class="arrow"/>

  <text x="700" y="315" text-anchor="middle" class="text">Figure bersifat problem-framing, bukan model hipotesis atau klaim kausal.</text>
</svg>