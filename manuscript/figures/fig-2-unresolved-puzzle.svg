<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .box{fill:#fafafa;stroke:#333;stroke-width:2;rx:14;ry:14}
      .dash{fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:10 7;rx:14;ry:14}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#222}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#333}
      .arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow2)}
    </style>
  </defs>

  <rect x="60" y="180" width="300" height="210" class="box"/>
  <text x="210" y="220" text-anchor="middle" class="title">People-management conditions</text>
  <text x="210" y="258" text-anchor="middle" class="text">leadership experience</text>
  <text x="210" y="288" text-anchor="middle" class="text">development practices</text>
  <text x="210" y="318" text-anchor="middle" class="text">career / rotation / learning</text>
  <text x="210" y="348" text-anchor="middle" class="text">implementation quality</text>

  <rect x="500" y="140" width="390" height="290" class="dash"/>
  <text x="695" y="180" text-anchor="middle" class="title">Competing employee-level processes</text>
  <text x="695" y="220" text-anchor="middle" class="text">engagement • affective commitment</text>
  <text x="695" y="250" text-anchor="middle" class="text">self-efficacy • meaningfulness</text>
  <text x="695" y="280" text-anchor="middle" class="text">perceived support • identification</text>
  <text x="695" y="310" text-anchor="middle" class="text">trust • psychological empowerment</text>
  <text x="695" y="350" text-anchor="middle" class="small">Tidak ada satu mekanisme yang dianggap dominan</text>
  <text x="695" y="376" text-anchor="middle" class="small">sebelum audit teori dan evidence selesai.</text>

  <rect x="1040" y="180" width="300" height="210" class="box"/>
  <text x="1190" y="220" text-anchor="middle" class="title">Individual work behavior</text>
  <text x="1190" y="258" text-anchor="middle" class="text">task performance</text>
  <text x="1190" y="288" text-anchor="middle" class="text">contextual performance</text>
  <text x="1190" y="318" text-anchor="middle" class="text">counterproductive behavior</text>
  <text x="1190" y="348" text-anchor="middle" class="text">role-relevant behavior</text>

  <rect x="480" y="475" width="430" height="95" class="box"/>
  <text x="695" y="510" text-anchor="middle" class="title">Boundary conditions / task requirements</text>
  <text x="695" y="542" text-anchor="middle" class="text">risk • hierarchy • task specialization • digital dependence</text>

  <path d="M360 285 L500 285" class="arrow"/>
  <path d="M890 285 L1040 285" class="arrow"/>
  <path d="M695 475 L695 430" class="arrow"/>

  <text x="700" y="50" text-anchor="middle" class="title">Integrated unresolved puzzle</text>
  <text x="700" y="82" text-anchor="middle" class="small">Kerangka analitis untuk menjelaskan problem; bukan structural model yang telah dikunci.</text>
</svg>